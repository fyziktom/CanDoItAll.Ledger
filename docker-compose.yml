name: candoitall-ledger-accountapp-demo

x-dotnet-build: &dotnet-build
  context: .
  additional_contexts:
    candoitall-components: ../CanDoItAll.Components
    candoitall-external-packages: ../CanDoItAll/ExternalPackages
  args:
    CDA_COMPONENTS_PACKAGE_VERSION: "0.1.2"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: candoitall_economy
      POSTGRES_USER: candoitall
      POSTGRES_PASSWORD: candoitall-dev
    ports:
      - "54329:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candoitall -d candoitall_economy && psql -U candoitall -d candoitall_economy -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Crash recovery on the Windows bind mount can take several minutes.
      # Successful checks still mark the service healthy immediately.
      start_period: 10m

  economy-node:
    image: candoitall-ledger-economy-node:dev
    build:
      <<: *dotnet-build
      dockerfile: docker/node/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      Economy__Persistence__Provider: PostgreSql
      Economy__Persistence__SchemaManagementMode: Migrate
      Economy__PostgreSql__ConnectionString: Host=postgres;Port=5432;Database=candoitall_economy;Username=candoitall;Password=candoitall-dev
      Economy__PostgreSql__EnableRetryOnFailure: "true"
      Economy__Treasury__AdminMainAmount: "1000000000000"
      Economy__Api__EnableRateLimiting: "false"
      Economy__Api__AllowLedgerReset: "true"
      Economy__Auth__Ui__Mode: Disabled
      Economy__Hosting__UseForwardedHeaders: "true"
      Economy__Auth__DataProtection__KeyRingPath: /var/lib/candoitall-economy/dpkeys
    ports:
      - "8080:8080"
    volumes:
      - ./docker/data/dpkeys:/var/lib/candoitall-economy/dpkeys
    restart: unless-stopped

  demo-seeder:
    image: candoitall-ledger-demo-seeder:dev
    build:
      <<: *dotnet-build
      dockerfile: docker/seeder/Dockerfile
    depends_on:
      - economy-node
    profiles:
      - seed
    environment:
      CANDOITALL_ECONOMY_NODE_URL: http://economy-node:8080/
      CANDOITALL_ECONOMY_DEMO_KEY_SET: accountapp-demo
      CANDOITALL_ECONOMY_DEMO_LEDGER_ID: default
      CANDOITALL_ECONOMY_DEMO_TOKEN_ID: bo.posts
      CANDOITALL_ECONOMY_DEMO_ALICE_MAIN_AMOUNT: "100000"
      CANDOITALL_ECONOMY_DEMO_BOB_MAIN_AMOUNT: "1000"
      CANDOITALL_ECONOMY_DEMO_ALICE_TOKEN_SUPPLY: "100000000"
      CANDOITALL_ECONOMY_DEMO_BOB_TOKEN_AMOUNT: "1000"
      CANDOITALL_ECONOMY_ACCOUNT_BACKUP_PASSWORD: accountapp-demo-password
      CANDOITALL_ECONOMY_TEST_KEY_ROOT: /var/lib/candoitall-economy-demo/keys
    volumes:
      - ./docker/demo-keys:/var/lib/candoitall-economy-demo/keys

  accountapp-alice:
    image: candoitall-ledger-accountapp:dev
    build:
      <<: *dotnet-build
      dockerfile: docker/accountapp/Dockerfile
    depends_on:
      - economy-node
    environment:
      ACCOUNT_APP_NODE_BASE_URI: http://localhost:5081/
      ACCOUNT_APP_LEDGER_ID: default
      ACCOUNT_APP_SCENARIO_ID: __null__
      ACCOUNT_APP_VAULT_ID: accountapp-alice
      ACCOUNT_APP_DEFAULT_ACCOUNT_NAME: Alice import test
      ACCOUNT_APP_ENABLE_IPFS_UPLOADS: "true"
      ACCOUNT_APP_IPFS_API_BASE_URI: http://localhost:5081/ipfs-api/
      ACCOUNT_APP_IPFS_GATEWAY_BASE_URI: http://localhost:5001/
      ACCOUNT_APP_IPFS_CONTENT_ENDPOINT_URI: http://localhost:5093/api/files/content
    ports:
      - "5081:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  accountapp-bob:
    image: candoitall-ledger-accountapp:dev
    build:
      <<: *dotnet-build
      dockerfile: docker/accountapp/Dockerfile
    depends_on:
      - economy-node
    environment:
      ACCOUNT_APP_NODE_BASE_URI: http://localhost:5082/
      ACCOUNT_APP_LEDGER_ID: default
      ACCOUNT_APP_SCENARIO_ID: __null__
      ACCOUNT_APP_VAULT_ID: accountapp-bob
      ACCOUNT_APP_DEFAULT_ACCOUNT_NAME: Bob import test
      ACCOUNT_APP_ENABLE_IPFS_UPLOADS: "true"
      ACCOUNT_APP_IPFS_API_BASE_URI: http://localhost:5082/ipfs-api/
      ACCOUNT_APP_IPFS_GATEWAY_BASE_URI: http://localhost:5001/
      ACCOUNT_APP_IPFS_CONTENT_ENDPOINT_URI: http://localhost:5093/api/files/content
    ports:
      - "5082:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  accountapp-lab:
    image: candoitall-ledger-accountapp:dev
    build:
      <<: *dotnet-build
      dockerfile: docker/accountapp/Dockerfile
    depends_on:
      - economy-node
    environment:
      ACCOUNT_APP_NODE_BASE_URI: http://localhost:5083/
      ACCOUNT_APP_LEDGER_ID: default
      ACCOUNT_APP_SCENARIO_ID: __null__
      ACCOUNT_APP_VAULT_ID: accountapp-lab
      ACCOUNT_APP_DEFAULT_ACCOUNT_NAME: Scratch account
      ACCOUNT_APP_ENABLE_IPFS_UPLOADS: "true"
      ACCOUNT_APP_IPFS_API_BASE_URI: http://localhost:5083/ipfs-api/
      ACCOUNT_APP_IPFS_GATEWAY_BASE_URI: http://localhost:5001/
      ACCOUNT_APP_IPFS_CONTENT_ENDPOINT_URI: http://localhost:5093/api/files/content
    ports:
      - "5083:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
