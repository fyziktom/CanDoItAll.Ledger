<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SB02 Account Setup Browser Harness</title>
  <style>
    body {
      margin: 0;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background: #f4f6f8;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
      letter-spacing: 0;
    }

    pre {
      min-height: 420px;
      margin: 0;
      padding: 20px;
      overflow: auto;
      border: 1px solid #d3dae3;
      border-radius: 8px;
      background: white;
      white-space: pre-wrap;
    }

    body[data-status="pass"] h1 {
      color: #126b3f;
    }

    body[data-status="fail"] h1 {
      color: #9b1c31;
    }
  </style>
</head>
<body data-status="running">
  <main>
    <h1 id="status">Running SB02 account setup browser harness</h1>
    <pre id="result">Starting...</pre>
  </main>
  <script type="module">
    import * as cryptoDriver from "/src/CanDoItAll.Economy.Cryptography.Browser/wwwroot/candoitall-economy-crypto.js";

    const result = document.getElementById("result");
    const status = document.getElementById("status");

    function bytesToBase64(bytes) {
      let binary = "";
      for (let index = 0; index < bytes.length; index += 1) {
        binary += String.fromCharCode(bytes[index]);
      }

      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }

      return bytes;
    }

    function textBase64(value) {
      return bytesToBase64(new TextEncoder().encode(value));
    }

    function bytesToHex(bytes) {
      return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
    }

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message);
      }
    }

    function assertEqual(actual, expected, message) {
      if (actual !== expected) {
        throw new Error(`${message}. Expected '${expected}', got '${actual}'.`);
      }
    }

    async function hashBase64(base64) {
      return bytesToHex(base64ToBytes(await cryptoDriver.sha256(base64)));
    }

    async function deriveVaultFields(password, privateKeyBase64, metadataBase64) {
      const salt = cryptoDriver.getRandomBytes(16);
      const nonce = cryptoDriver.getRandomBytes(12);
      const key = await cryptoDriver.pbkdf2Sha256(textBase64(password), salt, 10000, 32);
      const encryptedPrivateKey = await cryptoDriver.aesGcmEncrypt(key, nonce, privateKeyBase64, metadataBase64);
      return { salt, nonce, encryptedPrivateKey, key };
    }

    async function saveVault(vaultId, displayName, password, keyPair, address, keyId) {
      const publicKeyHash = await hashBase64(keyPair.publicKeyMaterialBase64);
      const metadataBase64 = textBase64(`vault|${vaultId}|${keyId}|${address}|${publicKeyHash}`);
      const fields = await deriveVaultFields(password, keyPair.privateKeyMaterialBase64, metadataBase64);
      const now = new Date().toISOString();
      const record = {
        vaultId,
        displayName,
        keyId,
        address,
        algorithm: 1,
        publicKeyHash,
        publicKeyMaterialBase64: keyPair.publicKeyMaterialBase64,
        encryptedPrivateKeyBase64: fields.encryptedPrivateKey,
        kdfSaltBase64: fields.salt,
        nonceBase64: fields.nonce,
        kdfIterations: 10000,
        kdfAlgorithm: "PBKDF2-SHA256",
        encryptionAlgorithm: "AES-256-GCM",
        createdAtUtc: now,
        updatedAtUtc: now
      };
      await cryptoDriver.saveVaultRecord(record);
      return { record, metadataBase64 };
    }

    async function unlockVault(record, password, metadataBase64) {
      const key = await cryptoDriver.pbkdf2Sha256(textBase64(password), record.kdfSaltBase64, record.kdfIterations, 32);
      return await cryptoDriver.aesGcmDecrypt(key, record.nonceBase64, record.encryptedPrivateKeyBase64, metadataBase64);
    }

    async function exportEncryptedBackup(displayName, password, keyPair, address, keyId) {
      const publicKeyHash = await hashBase64(keyPair.publicKeyMaterialBase64);
      const salt = cryptoDriver.getRandomBytes(16);
      const nonce = cryptoDriver.getRandomBytes(12);
      const key = await cryptoDriver.pbkdf2Sha256(textBase64(password), salt, 10000, 32);
      const associatedData = textBase64(`backup|${displayName}|${address}|${keyId}|${publicKeyHash}`);
      const encryptedPrivateKey = await cryptoDriver.aesGcmEncrypt(
        key,
        nonce,
        keyPair.privateKeyMaterialBase64,
        associatedData);
      return {
        format: "candoitall-economy-account-backup-v1",
        displayName,
        address,
        algorithm: 1,
        keyId,
        publicKeyHash,
        publicKeyMaterial: keyPair.publicKeyMaterialBase64,
        privateKeyProtection: "aes-gcm-pbkdf2-sha256",
        privateKeyMaterial: encryptedPrivateKey,
        salt,
        nonce,
        associatedData,
        notes: "SB02 browser harness",
        createdAtUtc: new Date().toISOString()
      };
    }

    async function importEncryptedBackup(backup, password) {
      const key = await cryptoDriver.pbkdf2Sha256(textBase64(password), backup.salt, 10000, 32);
      return await cryptoDriver.aesGcmDecrypt(key, backup.nonce, backup.privateKeyMaterial, backup.associatedData);
    }

    async function assertKeyPair(privateKeyBase64, publicKeyBase64) {
      const payload = textBase64("SB02 account setup signature payload");
      const signature = await cryptoDriver.signEcdsaP256Sha256(payload, privateKeyBase64);
      assertEqual(base64ToBytes(signature).length, 64, "signature length");
      assert(await cryptoDriver.verifyEcdsaP256Sha256(payload, signature, publicKeyBase64), "private key must sign for public key");
      return signature;
    }

    async function run() {
      const checks = [];
      const vaultId = `sb02-${Date.now()}`;
      const importedVaultId = `${vaultId}-imported`;
      const pastedVaultId = `${vaultId}-pasted`;
      const displayName = "Operations account";
      const keyId = `${vaultId}-key`;
      const address = `browser-${vaultId}`;

      await cryptoDriver.deleteVaultRecord(vaultId).catch(() => {});
      await cryptoDriver.deleteVaultRecord(importedVaultId).catch(() => {});
      await cryptoDriver.deleteVaultRecord(pastedVaultId).catch(() => {});

      const keyPair = await cryptoDriver.createEcdsaP256KeyPair();
      const created = await saveVault(vaultId, displayName, "vault-password", keyPair, address, keyId);
      const stored = await cryptoDriver.getVaultRecord(vaultId);
      assert(stored?.vaultId === vaultId, "created account saved to IndexedDB");
      assert(stored.displayName === displayName, "created account display name persisted");
      assert(stored.keyId === keyId, "created account key id persisted");
      assert(stored.encryptedPrivateKeyBase64 !== keyPair.privateKeyMaterialBase64, "vault does not store raw private key");
      checks.push("account:create-indexeddb-encrypted-vault");

      const unlockedPrivateKey = await unlockVault(stored, "vault-password", created.metadataBase64);
      assertEqual(unlockedPrivateKey, keyPair.privateKeyMaterialBase64, "created account unlock roundtrip");
      const unlockSignature = await assertKeyPair(unlockedPrivateKey, keyPair.publicKeyMaterialBase64);
      checks.push("account:unlock-and-sign");

      const backup = await exportEncryptedBackup(displayName, "backup-password", keyPair, address, keyId);
      const backupJson = JSON.stringify(backup);
      assert(!backupJson.includes(keyPair.privateKeyMaterialBase64), "encrypted backup does not contain raw private key");
      assert(backup.privateKeyMaterial !== keyPair.privateKeyMaterialBase64, "encrypted backup private material is ciphertext");
      checks.push("backup:export-encrypted");

      let wrongPasswordRejected = false;
      try {
        await importEncryptedBackup(backup, "wrong-password");
      } catch {
        wrongPasswordRejected = true;
      }

      assert(wrongPasswordRejected, "backup import rejects wrong password");
      checks.push("backup:reject-wrong-password");

      const importedPrivateKey = await importEncryptedBackup(backup, "backup-password");
      assertEqual(importedPrivateKey, keyPair.privateKeyMaterialBase64, "backup import restores same private key");
      await assertKeyPair(importedPrivateKey, backup.publicKeyMaterial);
      const imported = await saveVault(importedVaultId, backup.displayName, "new-vault-password", {
        publicKeyMaterialBase64: backup.publicKeyMaterial,
        privateKeyMaterialBase64: importedPrivateKey
      }, backup.address, backup.keyId);
      const importedRecord = await cryptoDriver.getVaultRecord(importedVaultId);
      assert(importedRecord?.vaultId === importedVaultId, "imported backup saved as new vault");
      assert(importedRecord.address === stored.address, "imported backup keeps address");
      assert(importedRecord.encryptedPrivateKeyBase64 !== stored.encryptedPrivateKeyBase64, "imported vault is re-encrypted");
      const reUnlockedPrivateKey = await unlockVault(importedRecord, "new-vault-password", imported.metadataBase64);
      assertEqual(reUnlockedPrivateKey, keyPair.privateKeyMaterialBase64, "imported vault unlock roundtrip");
      checks.push("backup:import-and-reencrypt-vault");

      const pastedKeyPair = await cryptoDriver.createEcdsaP256KeyPair();
      await assertKeyPair(pastedKeyPair.privateKeyMaterialBase64, pastedKeyPair.publicKeyMaterialBase64);
      const pasted = await saveVault(
        pastedVaultId,
        "Pasted account",
        "pasted-password",
        pastedKeyPair,
        `browser-${pastedVaultId}`,
        `${pastedVaultId}-key`);
      const pastedRecord = await cryptoDriver.getVaultRecord(pastedVaultId);
      assert(pastedRecord?.vaultId === pastedVaultId, "pasted private key import saved");
      const pastedPrivateKey = await unlockVault(pastedRecord, "pasted-password", pasted.metadataBase64);
      assertEqual(pastedPrivateKey, pastedKeyPair.privateKeyMaterialBase64, "pasted private key unlock roundtrip");
      checks.push("import:pasted-private-key");

      await cryptoDriver.deleteVaultRecord(vaultId);
      await cryptoDriver.deleteVaultRecord(importedVaultId);
      await cryptoDriver.deleteVaultRecord(pastedVaultId);

      return {
        status: "pass",
        checks,
        vaultId,
        importedVaultId,
        pastedVaultId,
        address,
        signatureLength: base64ToBytes(unlockSignature).length,
        publicKeyMaterialLength: base64ToBytes(keyPair.publicKeyMaterialBase64).length,
        privateKeyMaterialLength: base64ToBytes(keyPair.privateKeyMaterialBase64).length,
        backupJsonLength: backupJson.length
      };
    }

    run()
      .then(value => {
        document.body.dataset.status = "pass";
        status.textContent = "PASS: SB02 account setup browser harness";
        result.textContent = JSON.stringify(value, null, 2);
      })
      .catch(error => {
        document.body.dataset.status = "fail";
        status.textContent = "FAIL: SB02 account setup browser harness";
        result.textContent = `${error.stack || error.message || error}`;
      });
  </script>
</body>
</html>
