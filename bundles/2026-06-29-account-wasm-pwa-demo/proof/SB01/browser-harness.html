<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SB01 Browser Crypto Harness</title>
  <style>
    body {
      margin: 0;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background: #f4f6f8;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
      letter-spacing: 0;
    }

    pre {
      min-height: 360px;
      margin: 0;
      padding: 20px;
      overflow: auto;
      border: 1px solid #d3dae3;
      border-radius: 8px;
      background: white;
      white-space: pre-wrap;
    }

    body[data-status="pass"] h1 {
      color: #126b3f;
    }

    body[data-status="fail"] h1 {
      color: #9b1c31;
    }
  </style>
</head>
<body data-status="running">
  <main>
    <h1 id="status">Running SB01 browser crypto harness</h1>
    <pre id="result">Starting...</pre>
  </main>
  <script type="module">
    import * as cryptoDriver from "/src/CanDoItAll.Economy.Cryptography.Browser/wwwroot/candoitall-economy-crypto.js";

    const result = document.getElementById("result");
    const status = document.getElementById("status");

    function bytesToBase64(bytes) {
      let binary = "";
      for (let index = 0; index < bytes.length; index += 1) {
        binary += String.fromCharCode(bytes[index]);
      }

      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }

      return bytes;
    }

    function textBase64(value) {
      return bytesToBase64(new TextEncoder().encode(value));
    }

    function bytesToHex(bytes) {
      return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
    }

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message);
      }
    }

    async function run() {
      const checks = [];

      const randomBytes = base64ToBytes(cryptoDriver.getRandomBytes(16));
      assert(randomBytes.length === 16, "random byte count");
      checks.push("random:getRandomValues");

      const sha256 = base64ToBytes(await cryptoDriver.sha256(textBase64("abc")));
      assert(
        bytesToHex(sha256) === "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad",
        "sha256 abc vector");
      checks.push("digest:sha256");

      const salt = cryptoDriver.getRandomBytes(16);
      const nonce = cryptoDriver.getRandomBytes(12);
      const key = await cryptoDriver.pbkdf2Sha256(textBase64("correct horse battery staple"), salt, 10000, 32);
      const plaintext = textBase64("private key bytes");
      const associatedData = textBase64("vault metadata");
      const ciphertext = await cryptoDriver.aesGcmEncrypt(key, nonce, plaintext, associatedData);
      const decrypted = await cryptoDriver.aesGcmDecrypt(key, nonce, ciphertext, associatedData);
      assert(ciphertext !== plaintext, "aes-gcm ciphertext differs from plaintext");
      assert(decrypted === plaintext, "aes-gcm decrypt roundtrip");
      checks.push("kdf:pbkdf2-sha256");
      checks.push("cipher:aes-256-gcm");

      const keyPair = await cryptoDriver.createEcdsaP256KeyPair();
      const payload = textBase64("transaction payload hash");
      const signature = await cryptoDriver.signEcdsaP256Sha256(payload, keyPair.privateKeyMaterialBase64);
      assert(base64ToBytes(signature).length === 64, "p256 signature is raw 64-byte WebCrypto format");
      assert(await cryptoDriver.verifyEcdsaP256Sha256(payload, signature, keyPair.publicKeyMaterialBase64), "p256 signature verifies");
      assert(!await cryptoDriver.verifyEcdsaP256Sha256(textBase64("tampered"), signature, keyPair.publicKeyMaterialBase64), "tampered payload fails verification");
      checks.push("signature:ecdsa-p256-sha256");

      const vaultId = `sb01-${Date.now()}`;
      const encryptedPrivateKey = await cryptoDriver.aesGcmEncrypt(key, nonce, keyPair.privateKeyMaterialBase64, associatedData);
      const record = {
        vaultId,
        address: "cdia1F8rcobFeEPrELU4imLEc8ygid9KzBf",
        algorithm: 1,
        publicKeyHash: "00".repeat(32),
        publicKeyMaterialBase64: keyPair.publicKeyMaterialBase64,
        encryptedPrivateKeyBase64: encryptedPrivateKey,
        kdfSaltBase64: salt,
        nonceBase64: nonce,
        kdfIterations: 10000,
        kdfAlgorithm: "PBKDF2-SHA256",
        encryptionAlgorithm: "AES-256-GCM",
        createdAtUtc: new Date().toISOString(),
        updatedAtUtc: new Date().toISOString()
      };
      await cryptoDriver.saveVaultRecord(record);
      const stored = await cryptoDriver.getVaultRecord(vaultId);
      assert(stored?.vaultId === vaultId, "indexeddb saved and loaded vault record");
      assert(stored.encryptedPrivateKeyBase64 === encryptedPrivateKey, "indexeddb keeps encrypted private key payload");
      assert(stored.encryptedPrivateKeyBase64 !== keyPair.privateKeyMaterialBase64, "indexeddb does not store raw private key");
      const unlockedPrivateKey = await cryptoDriver.aesGcmDecrypt(key, nonce, stored.encryptedPrivateKeyBase64, associatedData);
      assert(unlockedPrivateKey === keyPair.privateKeyMaterialBase64, "indexeddb vault decrypts generated private key");
      const unlockedSignature = await cryptoDriver.signEcdsaP256Sha256(payload, unlockedPrivateKey);
      assert(await cryptoDriver.verifyEcdsaP256Sha256(payload, unlockedSignature, keyPair.publicKeyMaterialBase64), "unlocked private key signs successfully");
      await cryptoDriver.deleteVaultRecord(vaultId);
      assert(await cryptoDriver.getVaultRecord(vaultId) === null, "indexeddb delete removes vault record");
      checks.push("storage:indexeddb-vault");

      return {
        status: "pass",
        checks,
        randomLength: randomBytes.length,
        signatureLength: base64ToBytes(signature).length,
        vaultUnlockSignatureLength: base64ToBytes(unlockedSignature).length,
        publicKeyMaterialLength: base64ToBytes(keyPair.publicKeyMaterialBase64).length,
        privateKeyMaterialLength: base64ToBytes(keyPair.privateKeyMaterialBase64).length
      };
    }

    run()
      .then(value => {
        document.body.dataset.status = "pass";
        status.textContent = "PASS: SB01 browser crypto harness";
        result.textContent = JSON.stringify(value, null, 2);
      })
      .catch(error => {
        document.body.dataset.status = "fail";
        status.textContent = "FAIL: SB01 browser crypto harness";
        result.textContent = `${error.stack || error.message || error}`;
      });
  </script>
</body>
</html>
