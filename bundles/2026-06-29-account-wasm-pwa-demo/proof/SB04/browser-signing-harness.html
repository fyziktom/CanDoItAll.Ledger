<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SB04 Browser Signing Harness</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f7f7f4;
      color: #1c2430;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(760px, calc(100vw - 32px));
      padding: 24px;
      border: 1px solid #ccd3db;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(38, 48, 62, 0.12);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    dl {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 10px 14px;
      margin: 0;
      font-size: 14px;
      line-height: 1.35;
    }

    dt {
      color: #52606d;
      font-weight: 700;
    }

    dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    .ok {
      color: #14723b;
      font-weight: 700;
    }

    .error {
      color: #b42318;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>SB04 Browser Signing Harness</h1>
    <dl>
      <dt>Status</dt>
      <dd id="status">Running</dd>
      <dt>Payload hash</dt>
      <dd id="payloadHash">Pending</dd>
      <dt>Signature bytes</dt>
      <dd id="signatureBytes">Pending</dd>
      <dt>Verified</dt>
      <dd id="verified">Pending</dd>
      <dt>Broadcast body</dt>
      <dd id="broadcast">Pending</dd>
      <dt>Broadcast POST</dt>
      <dd id="broadcastPost">Pending</dd>
    </dl>
  </main>

  <script type="module">
    import {
      createEcdsaP256KeyPair,
      signEcdsaP256Sha256,
      verifyEcdsaP256Sha256,
      sha256
    } from "../../../../src/CanDoItAll.Economy.Cryptography.Browser/wwwroot/candoitall-economy-crypto.js";

    const textEncoder = new TextEncoder();

    function bytesToBase64(bytes) {
      let binary = "";
      for (let index = 0; index < bytes.length; index += 0x8000) {
        binary += String.fromCharCode(...bytes.subarray(index, index + 0x8000));
      }

      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }

      return bytes;
    }

    function bytesToHex(bytes) {
      return [...bytes].map((value) => value.toString(16).padStart(2, "0")).join("");
    }

    function setText(id, value, className) {
      const element = document.getElementById(id);
      element.textContent = value;
      if (className) {
        element.className = className;
      }
    }

    async function run() {
      const keyPair = await createEcdsaP256KeyPair();
      const payloadPreimage = "cdia.economy.input.independent.v1|tx-browser-draft|0|source-tx|0|cdia1browser";
      const payloadHashBase64 = await sha256(bytesToBase64(textEncoder.encode(payloadPreimage)));
      const payloadHash = bytesToHex(base64ToBytes(payloadHashBase64));
      const signatureBase64 = await signEcdsaP256Sha256(
        bytesToBase64(textEncoder.encode(payloadHash)),
        keyPair.privateKeyMaterialBase64);
      const publicKeyHash = bytesToHex(base64ToBytes(await sha256(keyPair.publicKeyMaterialBase64)));
      const verified = await verifyEcdsaP256Sha256(
        bytesToBase64(textEncoder.encode(payloadHash)),
        signatureBase64,
        keyPair.publicKeyMaterialBase64);

      const signedTransaction = {
        ledgerId: { value: "account-app-ledger" },
        scenarioId: { value: "browser-demo" },
        version: 1,
        kind: "Transfer",
        signingMode: "Independent",
        txId: { value: "tx-browser-draft" },
        inputs: [
          {
            inputIndex: 0,
            previousOutPoint: {
              txId: { value: "source-tx" },
              outputIndex: 0
            },
            address: { value: "cdia1browser" },
            signaturePayloadHash: { value: payloadHash },
            signatureBundle: {
              signatures: [
                {
                  algorithm: "EcdsaP256Sha256",
                  keyId: "browser-vault-key",
                  publicKeyHash: { value: publicKeyHash },
                  payloadHash: { value: payloadHash },
                  signatureBytes: signatureBase64,
                  publicKeyMaterial: keyPair.publicKeyMaterialBase64
                }
              ]
            }
          }
        ],
        outputs: [
          {
            outputIndex: 0,
            address: { value: "cdia1receiver" },
            mainAmount: { value: 1 }
          }
        ],
        data: null
      };

      const broadcastBody = JSON.stringify(signedTransaction);
      const privateKeyLeaked =
        broadcastBody.includes(keyPair.privateKeyMaterialBase64) ||
        /privateKey/i.test(broadcastBody);

      if (!verified || privateKeyLeaked) {
        throw new Error(`Browser signing proof failed. verified=${verified}; privateKeyLeaked=${privateKeyLeaked}`);
      }

      const broadcastResponse = await fetch("/api/v1/ledger/transactions", {
        method: "POST",
        headers: {
          "content-type": "application/json"
        },
        body: broadcastBody
      });
      const broadcastReceipt = await broadcastResponse.json();

      setText("payloadHash", payloadHash);
      setText("signatureBytes", String(base64ToBytes(signatureBase64).byteLength));
      setText("verified", String(verified), "ok");
      setText("broadcast", broadcastBody, "ok");
      setText("broadcastPost", `${broadcastResponse.status} ${JSON.stringify(broadcastReceipt)}`, "ok");
      setText("status", "Passed", "ok");

      window.__sb04Result = {
        success: true,
        payloadHash,
        publicKeyHash,
        signatureByteLength: base64ToBytes(signatureBase64).byteLength,
        verified,
        privateKeyLeaked,
        broadcastStatus: broadcastResponse.status,
        broadcastReceipt,
        broadcastBody
      };
    }

    run().catch((error) => {
      setText("status", error.message, "error");
      window.__sb04Result = {
        success: false,
        error: error.message
      };
    });
  </script>
</body>
</html>
